---
layout: default
title: Photos
sitemap: false
---
<div class="d-flex justify-content-center p-3">
  <div id="photo-carousel" class="carousel slide w-50" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="10000">
        <img src="{{ '/italy/images/101.jpg' | relative_url }}" class="d-block w-100" alt="Photo from Italy">
      </div>
      <div class="carousel-item" data-bs-interval="2000">
        <img src="{{ '/italy/images/102.jpg' | relative_url }}" class="d-block w-100" alt="Photo from Italy" loading="lazy">
      </div>
      <div class="carousel-item">
        <img src="{{ '/italy/images/103.jpg' | relative_url }}" class="d-block w-100" alt="Photo from Italy" loading="lazy">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#photo-carousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#photo-carousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
